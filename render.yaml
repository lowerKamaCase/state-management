databases:
  - name: tables-backend-db
    plan: free
    databaseName: cars
    user: cars_app

services:
  - type: web
    name: tables-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/main.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tables-backend-db
          property: connectionString
      - key: PORT
        value: 3000
      - key: CORS_ORIGINS
        value: http://localhost:5173,https://tables-frontend.onrender.com
      - key: NODE_ENV
        value: production

  - type: web
    name: tables-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://tables-backend-zpsi.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
