databases:
  - name: tables-backend-db
    plan: free
    databaseName: cars
    user: cars_app

services:
  - type: web
    name: tables-backend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/main.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tables-backend-db
          property: connectionString
      - key: PORT
        value: 3000
      - key: CORS_ORIGINS
        sync: false
      - key: NODE_ENV
        value: production
